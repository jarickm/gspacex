<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#gqGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Queue Stack Graphic / GQ Motif -->
  <g filter="url(#shadow)">
    <!-- Layer 3 (Bottom Stack) -->
    <rect x="136" y="324" width="240" height="44" rx="22" fill="#ffffff" fill-opacity="0.4" />
    
    <!-- Layer 2 (Middle Stack) -->
    <rect x="136" y="244" width="240" height="44" rx="22" fill="#ffffff" fill-opacity="0.75" />
    
    <!-- Layer 1 (Top Stack with Checkmark) -->
    <rect x="136" y="164" width="240" height="48" rx="24" fill="#ffffff" />
    
    <!-- Checkmark icon inside Top Bar -->
    <circle cx="178" cy="188" r="14" fill="#2563eb" />
    <path d="M172 188l4 4 8-8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Text lines inside Top Bar -->
    <rect x="206" y="184" width="130" height="8" rx="4" fill="#2563eb" fill-opacity="0.8" />
  </g>
</svg>
